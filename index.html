<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dự báo thời tiết</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="weather-container">
        <label class="switch">
            <input type="checkbox">
            <span class="slider"></span>
        </label>
        <h1><center>Dự báo thời tiết</center></h1>
        <input type="text" id="city-input" placeholder="Nhập thành phố...">
        <button onclick="getWeather()">Xem thời tiết</button>
        <div id="weather-info" class="hidden">
            <h2 id="city-name"></h2>
            <p id="temperature"></p>
            <p id="weather-description"></p>
            <img id="weather-icon" src="" alt="" class="weather-icon">
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
