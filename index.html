<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B1220">
    <title>Trạm thời tiết</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
</head>
<body>
    <div class="app">

        <header class="topbar">
            <div class="brand">
                <i class="fa-solid fa-cloud-sun brand-icon"></i>
                <span>Trạm thời tiết</span>
            </div>
            <div class="topbar-controls">
                <div class="unit-toggle" role="group" aria-label="Đơn vị nhiệt độ">
                    <button id="unit-c" type="button" class="unit-btn" onclick="setUnit('metric')">°C</button>
                    <button id="unit-f" type="button" class="unit-btn" onclick="setUnit('imperial')">°F</button>
                </div>
                <label class="switch" aria-label="Chuyển chế độ sáng / tối">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"><i class="fa-solid fa-sun icon-sun"></i><i class="fa-solid fa-moon icon-moon"></i></span>
                </label>
            </div>
        </header>

        <div class="search-container">
            <div class="search-wrapper">
                <i class="fa-solid fa-magnifying-glass search-icon"></i>
                <input type="text" id="city-input" placeholder="Nhập tên thành phố..." aria-label="Tên thành phố" autocomplete="off">
                <div id="suggestions" class="suggestions hidden"></div>
            </div>
            <button id="search-btn" type="button" onclick="getWeather()" aria-label="Tìm kiếm">
                <i class="fas fa-search"></i>
                <span class="btn-label">Tìm</span>
            </button>
            <button id="geo-btn" type="button" onclick="getWeatherByLocation()" aria-label="Dùng vị trí hiện tại">
                <i class="fas fa-location-crosshairs"></i>
                <span class="btn-label">Vị trí</span>
            </button>
        </div>

        <div class="chip-section hidden" id="favorites-section">
            <h4><i class="fa-solid fa-star"></i> Yêu thích</h4>
            <div id="favorite-cities" class="chip-row"></div>
        </div>

        <div class="chip-section hidden" id="recent-searches-section">
            <h4><i class="fa-solid fa-clock-rotate-left"></i> Tìm kiếm gần đây</h4>
            <div id="recent-cities" class="chip-row"></div>
        </div>

        <div id="loading" class="loading hidden">
            <div class="spinner"></div>
            <span>Đang tải dữ liệu...</span>
        </div>

        <div id="error-message" class="error-message hidden" role="alert"></div>

        <main id="weather-info" class="weather-grid hidden">

            <section class="panel now-card">
                <div class="now-head">
                    <div>
                        <h2 id="city-name"></h2>
                        <p class="updated-row">
                            <span id="updated-at"></span>
                            <button id="refresh-btn" type="button" class="icon-btn" onclick="manualRefresh()" aria-label="Làm mới">
                                <i class="fa-solid fa-arrows-rotate"></i>
                            </button>
                        </p>
                    </div>
                    <div class="now-head-actions">
                        <button id="favorite-btn" type="button" class="icon-btn" onclick="toggleFavoriteCurrent()" aria-label="Đánh dấu yêu thích">
                            <i class="fa-regular fa-star"></i>
                        </button>
                        <button id="share-btn" type="button" class="icon-btn" onclick="shareWeather()" aria-label="Chia sẻ">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>
                </div>

                <div class="now-body">
                    <img id="weather-icon" src="" alt="" class="weather-icon">
                    <div class="now-readout">
                        <p id="temperature" class="temperature"></p>
                        <p id="weather-description" class="description"></p>
                        <p id="feels-like-inline" class="feels-like-inline"></p>
                    </div>
                </div>
            </section>

            <section class="panel instrument-strip" aria-label="Chi tiết thời tiết">
                <div class="gauge">
                    <span class="gauge-label">Độ ẩm</span>
                    <span class="gauge-value" id="humidity"></span>
                </div>
                <div class="gauge">
                    <span class="gauge-label">Gió</span>
                    <span class="gauge-value" id="wind-speed"></span>
                    <span class="gauge-sub">
                        <svg id="wind-arrow" class="wind-arrow" viewBox="0 0 24 24" width="14" height="14"><path d="M12 2 L18 14 L12 10.5 L6 14 Z" fill="currentColor"/></svg>
                        <span id="wind-direction"></span>
                    </span>
                </div>
                <div class="gauge">
                    <span class="gauge-label">Áp suất</span>
                    <span class="gauge-value" id="pressure"></span>
                </div>
                <div class="gauge">
                    <span class="gauge-label">Tầm nhìn</span>
                    <span class="gauge-value" id="visibility"></span>
                </div>
                <div class="gauge">
                    <span class="gauge-label">Mặt trời mọc</span>
                    <span class="gauge-value" id="sunrise"></span>
                </div>
                <div class="gauge">
                    <span class="gauge-label">Mặt trời lặn</span>
                    <span class="gauge-value" id="sunset"></span>
                </div>
            </section>

            <section class="panel forecast-panel">
                <div class="tabs" role="tablist">
                    <button type="button" class="tab active" id="tab-hourly" role="tab" aria-selected="true" onclick="switchForecastTab('hourly')">Hôm nay</button>
                    <button type="button" class="tab" id="tab-daily" role="tab" aria-selected="false" onclick="switchForecastTab('daily')">5 ngày tới</button>
                </div>
                <div id="hourly-forecast" class="forecast-scroll"></div>
                <div id="forecast" class="forecast-scroll hidden"></div>
            </section>

            <section class="panel uv-panel">
                <h3>Chỉ số UV</h3>
                <div class="uv-readout">
                    <span id="uv-index" class="uv-number">--</span>
                    <div class="uv-bar"><div id="uv-bar-fill" class="uv-bar-fill"></div></div>
                    <span id="uv-label" class="uv-label"></span>
                </div>
            </section>

            <section class="panel air-quality">
                <h3>Chất lượng không khí</h3>
                <div class="air-quality-info">
                    <div class="air-quality-index">
                        <span id="aqi-value"></span>
                        <span id="aqi-level"></span>
                    </div>
                    <div class="air-quality-details">
                        <div class="pollutant"><span>PM2.5</span><span id="pm25"></span></div>
                        <div class="pollutant"><span>PM10</span><span id="pm10"></span></div>
                        <div class="pollutant"><span>NO2</span><span id="no2"></span></div>
                    </div>
                </div>
            </section>

            <section class="panel weather-map">
                <h3>Bản đồ thời tiết</h3>
                <div id="map"></div>
            </section>

            <section class="panel temperature-chart">
                <h3>Biểu đồ nhiệt độ</h3>
                <canvas id="tempChart"></canvas>
            </section>

        </main>

        <div id="toast" class="toast hidden"></div>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
